<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snortle AI Preview</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: rgb(18, 18, 18);
            --mini-text-color: white;
            --big-text-color: rgb(214, 214, 214);
            --chat-float-color: rgb(30, 30, 30);
            --input-bg-color: rgb(48, 48, 48);
            --accent: rgb(122, 92, 245);
            --accent-2: rgb(45, 200, 165);
            --user-bubble: rgb(88, 63, 197);
            --coin-color: rgb(255, 190, 60);
            --title-height: 60px;
        }

        * {
            font-family: "Quicksand", sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        html::-webkit-scrollbar, body::-webkit-scrollbar {
            display: none;
        }

        body {
            background-color: var(--bg-color);
        }

        .title {
            position: fixed;
            top: 0px;
            left: 0px;
            right: 0px;
            height: var(--title-height);
            z-index: 10;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            color: var(--big-text-color);
            background: linear-gradient(90deg, rgba(122,92,245,0.25), rgba(45,200,165,0.15));
            background-color: var(--chat-float-color);
            font-size: 32px;
            border-bottom: 2px solid var(--accent);
        }

        #title-main {
            grid-column: 2;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #title-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            object-position: 110% center;
        }

        #coin-counter {
            grid-column: 3;
            justify-self: end;
            margin-right: 20px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 2px;
        }

        #coin-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 15px;
            color: var(--coin-color);
            background-color: var(--input-bg-color);
            padding: 6px 14px 6px 8px;
            border-radius: 20px;
            border: 1px solid rgba(255, 190, 60, 0.4);
            white-space: nowrap;
        }

        #coin-icon-wrap {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
        }

        #coin-icon {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scale(1.1);
        }

        #chat-place {
            max-width: 800px;
            height: calc(100vh - var(--title-height));
            margin: 0 auto;
            display: flex;
            flex-direction: column;
        }

        #top-spacer {
            height: var(--title-height);
            flex-shrink: 0;
        }

        #welcome {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 14px;
            transform: translateY(70px);
        }

        #welcome-icon {
            width: 84px;
            height: 84px;
            border-radius: 50%;
            object-fit: cover;
            object-position: 100% center;
            border: 3px solid var(--accent-2);
            box-shadow: 0 0 0 6px rgba(45, 200, 165, 0.12);
        }

        #welcome h2 {
            font-size: 24px;
            font-weight: 600;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        #welcome p {
            font-size: 15px;
            color: var(--big-text-color);
            max-width: 380px;
            line-height: 1.5;
        }

        #welcome.hidden {
            display: none;
        }

        .user-box {
            display: flex;
            width: 100%;
            height: fit-content;
            justify-content: right;
        }

        .user {
            margin-top: 20px;
            margin-right: 20px;
            display: flex;
            float: right;
            max-width: 650px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            word-break: break-word;
            font-size: 16px;
            padding: 15px;
            border-radius: 16px;
            background-color: var(--user-bubble);
            color: var(--mini-text-color);
        }

        .bot-box {
            display: flex;
            width: 100%;
            justify-content: left;
            gap: 10px;
        }

        #bot-avatar {
            flex-shrink: 0;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            margin-top: 20px;
            object-fit: cover;
            object-position: 100% center;
            border: 2px solid var(--accent-2);
        }

        .bot{
            margin-top: 20px;
            margin-left: 0px;
            margin-right: 20px;
            display: flex;
            flex-direction: column;
            max-width: calc(100% - 90px);
            overflow-wrap: anywhere;
            word-break: break-word;
            font-size: 17px;
            padding: 15px;
            border-radius: 15px;
            background-color: var(--chat-float-color);
            border-left: 3px solid var(--accent-2);
            color: var(--mini-text-color);
            white-space: pre-line;
        }

        form {
            position: fixed;
            display: flex;
            bottom: 15px;
            left: 0;
            right: 0;
            margin-right: auto;
            margin-left: auto;
            max-width: 750px;
            justify-content: space-between;
            align-items: flex-end;
        }

        #chat-input {
            width: 100%;
            max-height: 160px;
            padding: 16px;
            font-size: 15px;
            color: var(--mini-text-color);
            background-color: var(--input-bg-color);
            border-radius: 20px;
            border: 2px solid transparent;
            margin-left: 20px;
            resize: none;
            overflow-y: auto;
            overflow-wrap: anywhere;
            word-break: break-word;
            line-height: 1.4;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        #chat-input::-webkit-scrollbar {
            display: none;
        }

        #chat-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        #gap-blocker {
            flex-shrink: 0;
            width: 10px;
            align-self: stretch;
            background-color: var(--bg-color);
        }

        #send-btn {
            flex-shrink: 0;
            width: 48px;
            height: 48px;
            margin-right: 20px;
            border-radius: 50%;
            border: none;
            background-color: var(--accent);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            transition: background-color 0.1s ease, transform 0.1s ease;
        }

        #send-btn:active {
            transform: scale(0.92);
        }

        #send-btn:disabled {
            background-color: var(--input-bg-color);
            cursor: not-allowed;
        }

        #send-btn svg {
            display: block;
            width: 22px;
            height: 22px;
        }

        #send-btn:hover {
            background-color: var(--accent-2);
        }

        #spacer {
            display: flex;
            width: 100%;
            height: 210px;
            flex-shrink: 0;
        }

        .black-out {
            position: fixed;
            width: 100vw;
            height: 210px;
            bottom: 0px;
            left: -8px;
            background: none;
            pointer-events: none;
        }

        .black-out form {
            pointer-events: auto;
        }

        .bot-reply {
            white-space: pre-line;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .bot-caption {
            margin-top: 8px;
            font-size: 14px;
            color: var(--accent-2);
            letter-spacing: 0.2px;
            line-height: 1.5;
        }

        #popup-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }

        #popup-overlay.visible {
            display: flex;
        }

        #popup-box {
            background-color: var(--chat-float-color);
            border: 1px solid var(--accent);
            border-radius: 16px;
            padding: 22px 24px;
            max-width: 320px;
            text-align: center;
            color: var(--mini-text-color);
        }

        #popup-box img {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            object-fit: cover;
            object-position: 100% center;
            margin-bottom: 10px;
            border: 2px solid var(--accent-2);
        }

        #popup-box h3 {
            font-size: 17px;
            margin-bottom: 8px;
            color: var(--coin-color);
        }

        #popup-box p {
            font-size: 14px;
            color: var(--big-text-color);
            line-height: 1.5;
            margin-bottom: 16px;
        }

        #popup-close {
            background-color: var(--accent);
            border: none;
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
        }

        #popup-close:hover {
            background-color: var(--accent-2);
        }
    </style>
</head>
<body>
    <h1 class="title">
        <span id="title-main">
            <img id="title-icon" src="snortle.png" alt="">
            Snortle AI Preview
        </span>
        <span id="coin-counter">
            <span id="coin-pill"><span id="coin-icon-wrap"><img id="coin-icon" src="snortz-coin.png" alt=""></span><span id="coin-amount">30.000 Snortz Coins</span></span>
        </span>
    </h1>
    <main id="chat-place">
        <div id="top-spacer"></div>
        <div id="welcome">
            <img id="welcome-icon" src="snortle.png" alt="">
            <h2>Ready when you are</h2>
            <p>Ask Snortle anything. Use Snortz Coins (Snore + Hertz).</p>
        </div>
        <div id="spacer"></div>
    </main>

    <div id="popup-overlay">
        <div id="popup-box">
            <img src="snortle.png" alt="">
            <h3 id="popup-title">Almost out of coins</h3>
            <p id="popup-text">You're under 0.5 Snortz Coins, so you can't send any more prompts right now.</p>
            <button id="popup-close">Got it</button>
        </div>
    </div>

    <div class="black-out">
        <form id="form">
            <textarea id="chat-input" autocomplete="off" placeholder="Connecting..." rows="1"></textarea>
            <div id="gap-blocker"></div>
            <button type="submit" id="send-btn" aria-label="Send">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="19" x2="12" y2="5"></line>
                    <polyline points="6 11 12 5 18 11"></polyline>
                </svg>
            </button>
        </form>
    </div>

    <script type="module">
        import { Client } from "https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js";

        const input = document.getElementById("chat-input");
        const form = document.getElementById("form");
        const spacer = document.getElementById("spacer");
        const coinAmount = document.getElementById("coin-amount");
        const sendBtn = document.getElementById("send-btn");
        const welcome = document.getElementById("welcome");
        const popupOverlay = document.getElementById("popup-overlay");
        const popupTitle = document.getElementById("popup-title");
        const popupText = document.getElementById("popup-text");
        const popupClose = document.getElementById("popup-close");

        const LOW_COIN_WARNING_THRESHOLD = 1;
        const CANNOT_PROMPT_THRESHOLD = 0.5;

        const sessionId = Math.random().toString(36).slice(2);

        let client = null;
        let coinBalance = 20;
        let isWaiting = false;
        let lowWarningShown = false;
        let cannotPromptShown = false;

        function updateSendAvailability() {
            const outOfCoins = coinBalance < CANNOT_PROMPT_THRESHOLD;
            sendBtn.disabled = outOfCoins || isWaiting;
        }

        function showPopup(title, text) {
            popupTitle.textContent = title;
            popupText.textContent = text;
            popupOverlay.classList.add("visible");
        }

        function updateCoinDisplay() {
            coinAmount.textContent = coinBalance.toFixed(3) + " Snortz Coins";

            if (coinBalance < CANNOT_PROMPT_THRESHOLD) {
                input.placeholder = "Out of Snortz Coins";
                if (!cannotPromptShown) {
                    cannotPromptShown = true;
                    showPopup("Almost out of coins", "You're under 0.5 Snortz Coins, so you can't send any more prompts right now.");
                }
            } else if (coinBalance < LOW_COIN_WARNING_THRESHOLD) {
                if (!lowWarningShown) {
                    lowWarningShown = true;
                    showPopup("Running low on coins", "You're under 1 Snortz Coin. Keep an eye on your balance.");
                }
            }

            updateSendAvailability();
        }

        popupClose.addEventListener("click", function() {
            popupOverlay.classList.remove("visible");
        });

        async function connect() {
            try {
                client = await Client.connect("Snortle-AI/Snortle-Pancake-1");
                input.placeholder = "Ask something...";
            } catch (err) {
                input.placeholder = "Failed to connect. Refresh to retry.";
                console.error("Gradio connect failed:", err);
            }
        }

        connect();

        function scrollDown() {
            window.scrollTo({
                top: document.body.scrollHeight,
                behavior: 'smooth'
            });
        }

        function resizeInput() {
            input.style.height = "auto";
            const newHeight = Math.min(input.scrollHeight, 160);
            input.style.height = newHeight + "px";
        }

        resizeInput();
        updateCoinDisplay();

        input.addEventListener("input", resizeInput);

        input.addEventListener("keydown", function(event) {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                if (coinBalance < CANNOT_PROMPT_THRESHOLD || isWaiting) return;
                form.requestSubmit();
            }
        });

        async function reply(userInput) {
            isWaiting = true;
            updateSendAvailability();

            const botBox = document.createElement("div");
            botBox.classList.add("bot-box");

            const avatar = document.createElement("img");
            avatar.id = "bot-avatar";
            avatar.src = "snortle.png";
            avatar.alt = "";

            const bot = document.createElement("div");
            bot.classList.add("bot");
            bot.textContent = "Thinking...";

            botBox.appendChild(avatar);
            botBox.appendChild(bot);
            spacer.before(botBox);
            scrollDown();

            const startTime = performance.now();

            try {
                if (!client) {
                    throw new Error("Not connected yet, please wait and try again.");
                }

                const result = await client.predict("/predict", {
                    prompt: userInput,
                    session_id: sessionId,
                    max_tokens: 128,
                });

                const totalTime = (performance.now() - startTime) / 1000;

                const data = result.data[0];
                const response = data.output;
                const thinkTime = data.think_time;
                const generationTime = data.generation_time;
                const generatedTokens = data.gen_token_count;

                const thinkCost = thinkTime / 30;
                const genTokenCost = generatedTokens / 750;
                const spent = thinkCost + genTokenCost;

                coinBalance = coinBalance - spent;
                if (coinBalance < 0) {
                    coinBalance = 0;
                }
                updateCoinDisplay();

                bot.textContent = "";

                const replyText = document.createElement("div");
                replyText.classList.add("bot-reply");
                replyText.textContent = response;

                const caption = document.createElement("div");
                caption.classList.add("bot-caption");
                caption.textContent =
                    `Thought for ${thinkTime.toFixed(2)}s\n` +
                    `${generatedTokens} tokens in ${generationTime.toFixed(2)}s\n` +
                    `${totalTime.toFixed(2)}s total\n` +
                    `${spent.toFixed(3)} Snortz Coins`;

                bot.appendChild(replyText);
                bot.appendChild(caption);
            } catch (err) {
                bot.textContent = "Something went wrong: " + err.message;
            }

            isWaiting = false;
            updateSendAvailability();
            scrollDown();
        }

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            if (coinBalance < CANNOT_PROMPT_THRESHOLD) return;
            if (isWaiting) return;
            if (input.value.trim() === '') return;

            welcome.classList.add("hidden");

            const userBox = document.createElement("div");
            const user = document.createElement("div");

            user.textContent = input.value;

            userBox.classList.add("user-box");
            user.classList.add("user");

            spacer.before(userBox);
            userBox.appendChild(user);

            scrollDown();

            const toSend = input.value;
            input.value = "";
            resizeInput();

            reply(toSend);
        });

        scrollDown();
    </script>
</body>
</html>
