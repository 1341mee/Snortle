<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snortle Admin</title>
  <link rel="icon" type="image/svg+xml" href="/views/images/favicon.svg">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: #f9fafb;
    }
    .wrap {
      max-width: 1100px;
      margin: 48px auto;
      padding: 24px;
    }
    h1 {
      margin-bottom: 24px;
      font-size: 2rem;
    }
    h2 {
      margin: 0 0 14px;
      font-size: 1.1rem;
    }
    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .card {
      background: #1f2937;
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }
    .label {
      color: #9ca3af;
      font-size: 0.85rem;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .value {
      font-size: 1.8rem;
      font-weight: 700;
    }
    .give-card {
      margin-bottom: 24px;
    }
    .give-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .give-row input {
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #374151;
      background: #111827;
      color: #f9fafb;
      font-size: 1rem;
      min-width: 0;
    }
    #giveUsername {
      flex: 2 1 200px;
    }
    #giveAmount {
      flex: 1 1 120px;
    }
    .give-row button {
      padding: 10px 18px;
      border: 0;
      border-radius: 8px;
      background: #f59e0b;
      color: #111827;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
    }
    .give-row button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .hint {
      margin-top: 10px;
      color: #9ca3af;
      font-size: 0.85rem;
    }
    #giveMessage {
      margin-top: 10px;
      font-size: 0.95rem;
      min-height: 1.2em;
    }
    #giveMessage.ok { color: #86efac; }
    #giveMessage.bad { color: #fca5a5; }
    .table-scroll {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #111827;
      border: 1px solid #374151;
    }
    th, td {
      text-align: left;
      padding: 12px 14px;
      border-bottom: 1px solid #374151;
    }
    th {
      background: #1f2937;
      color: #d1d5db;
    }
    td.name {
      cursor: pointer;
      color: #fcd34d;
    }
    tr.suspicious {
      background: rgba(239, 68, 68, 0.12);
    }
    .risk {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.8rem;
      text-transform: uppercase;
    }
    .risk.low { background: rgba(34,197,94,0.18); color: #86efac; }
    .risk.high { background: rgba(239,68,68,0.18); color: #fca5a5; }
    .error {
      color: #fca5a5;
      margin-top: 20px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Snortle Admin</h1>
    <div class="summary">
      <div class="card">
        <div class="label">Total users</div>
        <div class="value" id="totalUsers">0</div>
      </div>
      <div class="card">
        <div class="label">Suspicious</div>
        <div class="value" id="suspiciousUsers">0</div>
      </div>
    </div>

    <div class="card give-card">
      <h2>Give Snortz Coins</h2>
      <div class="give-row">
        <input id="giveUsername" type="text" placeholder="Username (or click a name below)" autocomplete="off">
        <input id="giveAmount" type="number" placeholder="Amount" step="any">
        <button id="giveBtn" type="button">Give coins</button>
      </div>
      <div class="hint">Adds to the purchased wallet. Use a negative number to take coins away. The person must refresh their page to see it.</div>
      <div id="giveMessage"></div>
    </div>

    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>Username</th>
            <th>Plan</th>
            <th>Free coins</th>
            <th>Paid coins</th>
            <th>Chats</th>
            <th>Risk</th>
            <th>Created</th>
          </tr>
        </thead>
        <tbody id="userRows"></tbody>
      </table>
    </div>

    <div id="errorBox" class="error"></div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const adminKey = urlParams.get('key') || '';

    const giveUsername = document.getElementById('giveUsername');
    const giveAmount = document.getElementById('giveAmount');
    const giveBtn = document.getElementById('giveBtn');
    const giveMessage = document.getElementById('giveMessage');

    // Adds one cell to a row, using textContent so usernames can never run as code
    function addCell(row, text, className) {
      const td = document.createElement('td');
      td.textContent = text;
      if (className) td.className = className;
      row.appendChild(td);
      return td;
    }

    async function loadUsers() {
      try {
        const response = await fetch('/api/admin/users?key=' + encodeURIComponent(adminKey));
        const payload = await response.json();

        if (!response.ok || !payload.success) {
          throw new Error(payload.message || 'Admin access denied');
        }

        const rows = document.getElementById('userRows');
        rows.innerHTML = '';

        document.getElementById('totalUsers').textContent = payload.summary.totalUsers;
        document.getElementById('suspiciousUsers').textContent = payload.summary.suspiciousUsers;

        payload.users.forEach((user) => {
          const tr = document.createElement('tr');
          if (user.suspicious) tr.classList.add('suspicious');

          const nameCell = addCell(tr, user.username, 'name');
          nameCell.title = 'Click to fill the give-coins form';
          nameCell.addEventListener('click', () => {
            giveUsername.value = user.username;
            giveAmount.focus();
          });

          addCell(tr, user.planId);
          addCell(tr, user.freeSnortzCoins);
          addCell(tr, user.purchasedSnortzCoins);
          addCell(tr, user.chatCount);

          const riskCell = document.createElement('td');
          const risk = document.createElement('span');
          risk.className = 'risk ' + (user.suspicious ? 'high' : 'low');
          risk.textContent = user.suspicious ? 'high' : 'low';
          riskCell.appendChild(risk);
          tr.appendChild(riskCell);

          addCell(tr, user.createdAt ? new Date(user.createdAt).toLocaleString() : '—');
          rows.appendChild(tr);
        });
      } catch (error) {
        const errorBox = document.getElementById('errorBox');
        errorBox.style.display = 'block';
        errorBox.textContent = error.message;
      }
    }

    function showGiveMessage(text, good) {
      giveMessage.textContent = text;
      giveMessage.className = good ? 'ok' : 'bad';
    }

    giveBtn.addEventListener('click', async () => {
      const username = giveUsername.value.trim();
      const amount = Number(giveAmount.value);

      if (!username) {
        showGiveMessage('Enter a username.', false);
        return;
      }
      if (!giveAmount.value || !Number.isFinite(amount) || amount === 0) {
        showGiveMessage('Enter an amount (not 0).', false);
        return;
      }

      giveBtn.disabled = true;
      try {
        const response = await fetch('/api/admin/give-coins', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key: adminKey, username: username, amount: amount })
        });
        const result = await response.json();
        if (!response.ok || !result.success) {
          throw new Error(result.message || 'Failed.');
        }
        showGiveMessage(result.username + ' now has ' + result.purchasedSnortzCoins + ' purchased coins.', true);
        giveAmount.value = '';
        loadUsers();
      } catch (error) {
        showGiveMessage(error.message, false);
      } finally {
        giveBtn.disabled = false;
      }
    });

    loadUsers();
  </script>
</body>
</html>
