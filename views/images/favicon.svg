<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Sleeping tortoise</title>

  <!-- Front arm with three rounded toes (behind the head) -->
  <path d="M100 140 C92 154 90 182 104 193 Q140 199 178 194.5
           C194 195 194 179 182 180
           C195 181 195 166 182 167
           C195 168 195 153 178 153
           C175 152 172 151 168 151
           C150 150 130 148 118 142 Z"
        fill="#F0C27A" stroke="#5C3A1E" stroke-width="4" stroke-linejoin="round"/>
  <!-- Freckles on the arm -->
  <circle cx="104" cy="177" r="1.8" fill="#B9823A"/>
  <circle cx="113" cy="187" r="1.8" fill="#B9823A"/>
  <circle cx="123" cy="179" r="1.8" fill="#B9823A"/>
  <circle cx="134" cy="188" r="1.8" fill="#B9823A"/>
  <circle cx="145" cy="180" r="1.8" fill="#B9823A"/>

  <!-- Head (fill) -->
  <path d="M92 106 C98 90 116 78 138 78 C160 78 176 84 184 96 C188 102 195 108 194 120 C194 128 191 134 186 140 C176 154 158 164 136 166 C118 167 102 160 92 150 Z"
        fill="#F0C27A"/>
  <!-- Jaw shading -->
  <path d="M96 148 C108 158 122 162 138 162 C158 160 176 152 186 138 C178 146 162 154 140 156 C122 157 108 152 96 144 Z"
        fill="#E2AE5F" opacity="0.6"/>
  <!-- Head highlight -->
  <path d="M120 92 Q142 82 166 90" fill="none" stroke="#FBE3B0" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  <!-- Scale ticks -->
  <path d="M124 100 L127 108 M133 94 L137 101 M122 118 L126 125" fill="none" stroke="#B9823A" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Cheek -->
  <circle cx="140" cy="124" r="7" fill="#E5896F" opacity="0.4"/>
  <!-- Closed eye -->
  <path d="M144 106 Q156 118 168 106" fill="none" stroke="#5C3A1E" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Nostril -->
  <ellipse cx="183" cy="108" rx="2.6" ry="3.4" fill="#5C3A1E"/>
  <!-- Smile -->
  <path d="M191 125 C187 142 166 148 150 132 C147 129 148 126 150 124" fill="none" stroke="#5C3A1E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Head outline -->
  <path d="M92 106 C98 90 116 78 138 78 C160 78 176 84 184 96 C188 102 195 108 194 120 C194 128 191 134 186 140 C176 154 158 164 136 166 C118 167 102 160 92 150 Z"
        fill="none" stroke="#5C3A1E" stroke-width="4" stroke-linejoin="round"/>

  <!-- Shell (slightly scaled down) -->
  <g transform="translate(4 150) scale(0.93) translate(-4 -150)">
    <path d="M4 150 C2 104 24 66 58 66 C88 66 112 84 112 112 L110 146 Q58 158 4 150 Z"
          fill="#E2AE5F" stroke="#5C3A1E" stroke-width="4" stroke-linejoin="round"/>
    <!-- Shell highlight -->
    <path d="M46 74 Q60 69 74 72" fill="none" stroke="#F5D08F" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <!-- Rim band -->
    <path d="M5 138 Q58 150 111 134 L110 146 Q58 158 4 150 Z" fill="#C99145" stroke="#5C3A1E" stroke-width="3" stroke-linejoin="round"/>
    <path d="M23 141 L24.5 152 M60 143 L58 153 M94 138.5 L96 148.5" fill="none" stroke="#5C3A1E" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Plates -->
    <path d="M42 84 L76 84 L90 104 L76 124 L42 124 L28 104 Z" fill="#EBBF78" stroke="#5C3A1E" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M42 84 L34.5 73.7 M76 84 L86 72.5 M90 104 L111 106 M76 124 L79 141 M42 124 L41 143 M28 104 L12 103" fill="none" stroke="#5C3A1E" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Zzz -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="128,54 138,54 128,64 138,64" stroke="#5C3A1E" stroke-width="7"/>
    <polyline points="128,54 138,54 128,64 138,64" stroke="#F2B84B" stroke-width="4"/>
    <polyline points="148,32 162,32 148,46 162,46" stroke="#5C3A1E" stroke-width="7.5"/>
    <polyline points="148,32 162,32 148,46 162,46" stroke="#F2B84B" stroke-width="4.5"/>
    <polyline points="170,8 190,8 170,28 190,28" stroke="#5C3A1E" stroke-width="8"/>
    <polyline points="170,8 190,8 170,28 190,28" stroke="#F2B84B" stroke-width="5"/>
  </g>
</svg>
