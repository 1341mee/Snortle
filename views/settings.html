<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snortle Settings</title>
    <link rel="icon" type="image/svg+xml" href="/views/images/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/views/shared-settings.css">
    <style>
        :root {
            --bg-color: rgb(22, 21, 19);
            --mini-text-color: rgb(240, 236, 228);
            --big-text-color: rgb(196, 190, 178);
            --chat-float-color: rgb(32, 30, 27);
            --input-bg-color: rgb(46, 43, 39);
            --accent: rgb(205, 163, 90);
            --accent-2: rgb(90, 110, 100);
            --user-bubble: rgb(68, 60, 48);
            --coin-color: rgb(216, 168, 74);
            --title-height: 60px;
            --sidebar-w: 60px;
        }

        body.sidebar-expanded {
            --sidebar-w: 260px;
        }

        body.sidebar-collapsed {
            --sidebar-w: 0px;
        }

        * {
            font-family: "Quicksand", sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            scrollbar-width: none;
            -ms-overflow-style: none;
            overflow: hidden;
        }

        html::-webkit-scrollbar, body::-webkit-scrollbar {
            display: none;
        }

        body {
            background-color: var(--bg-color);
        }

        .title {
            position: fixed;
            top: 0px;
            left: 0px;
            right: 0px;
            height: var(--title-height);
            z-index: 10;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            color: var(--mini-text-color);
            background-color: var(--chat-float-color);
            font-size: 19px;
            font-weight: 600;
            border-bottom: 1px solid rgba(205, 163, 90, 0.4);
        }

        #title-main {
            grid-column: 2;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.01em;
        }

        #title-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            object-position: 110% center;
        }

        .chat-shell {
            margin-left: var(--sidebar-w);
            height: calc(100vh - var(--title-height));
            transition: margin-left 0.2s ease;
        }

        .chat-shell.collapsed {
            margin-left: 0;
        }

        .sidebar {
            position: fixed;
            top: var(--title-height);
            left: 0;
            width: var(--sidebar-w);
            height: calc(100vh - var(--title-height));
            background: rgb(14, 13, 12);
            border-right: 1px solid rgba(205, 163, 90, 0.28);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 14px 12px 18px;
            transition: transform 0.2s ease, width 0.2s ease;
            z-index: 8;
        }

        .sidebar.collapsed {
            transform: translateX(-100%);
        }

        .sidebar .label,
        .sidebar .brand-text,
        .sidebar .sidebar-section,
        .sidebar .chat-list,
        .sidebar .model-picker,
        .sidebar .model-lock {
            opacity: 0;
            white-space: nowrap;
            transition: opacity 0.15s ease;
        }

        body.sidebar-expanded .sidebar .label,
        body.sidebar-expanded .sidebar .brand-text,
        body.sidebar-expanded .sidebar .sidebar-section,
        body.sidebar-expanded .sidebar .chat-list,
        body.sidebar-expanded .sidebar .model-picker,
        body.sidebar-expanded .sidebar .model-lock {
            opacity: 1;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 10px;
            padding: 6px 8px 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 14px;
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--mini-text-color);
            font-size: 15px;
            font-weight: 700;
        }

        .sidebar-brand img {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
            object-position: 110% center;
            border: 1px solid var(--accent);
        }

        .sidebar-toggle {
            position: fixed;
            top: calc(var(--title-height) + 16px);
            left: calc(var(--sidebar-w) + 8px);
            width: 34px;
            height: 34px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(32, 30, 27, 0.94);
            color: var(--mini-text-color);
            cursor: pointer;
            font-size: 18px;
            line-height: 1;
            z-index: 25;
            transition: left 0.2s ease, transform 0.15s ease;
        }

        .sidebar-toggle:hover {
            border-color: var(--accent);
        }

        body.sidebar-collapsed .sidebar-toggle {
            left: 12px;
        }

        .new-chat-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: 1px solid rgba(205, 163, 90, 0.4);
            border-radius: 4px;
            background: var(--accent);
            color: rgb(24, 22, 19);
            font-weight: 700;
            padding: 12px 14px;
            cursor: pointer;
            margin-bottom: 18px;
            transition: background-color 0.16s ease, opacity 0.16s ease;
        }

        .new-chat-btn:hover {
            background: rgb(224, 184, 112);
        }

        .sidebar-actions {
            display: flex;
            flex-direction: column;
            margin-bottom: 8px;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.03);
            color: var(--big-text-color);
            padding: 11px 14px;
            text-align: left;
            font: inherit;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 10px;
            transition: background-color 0.16s ease, border-color 0.16s ease;
            text-decoration: none;
        }

        .sidebar-link:hover {
            background: rgba(205, 163, 90, 0.12);
            border-color: rgba(205, 163, 90, 0.4);
        }

        .sidebar-section {
            color: var(--big-text-color);
            font-size: 12px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            padding: 0 8px 10px;
            opacity: 0.8;
        }

        .settings-box {
            max-width: 420px;
            margin: 0 auto;
            padding: calc(var(--title-height) + 48px) 24px 48px;
        }

        .settings-box h2 {
            font-size: 25px;
            margin-bottom: 6px;
            font-weight: 600;
            color: var(--mini-text-color);
        }

        .settings-box p {
            color: var(--big-text-color);
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .wallet-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--mini-text-color);
            font-size: 15px;
        }

        .wallet-amount {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--coin-color);
            font-weight: 700;
        }

        .wallet-amount img {
            width: 20px;
            height: 20px;
            border-radius: 50%;
        }

        .settings-divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.08);
            margin: 16px 0;
        }

        .settings-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            color: var(--big-text-color);
            font-size: 14px;
        }

        .settings-row strong {
            color: var(--mini-text-color);
        }

        .settings-theme {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            color: var(--big-text-color);
            font-size: 14px;
        }

        .settings-theme select {
            padding: 6px 10px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: var(--input-bg-color);
            color: var(--mini-text-color);
            font: inherit;
        }

        .logout-btn,
        .settings-btn--danger {
            width: 100%;
            padding: 12px;
            border-radius: 4px;
            border: none;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
        }

        .logout-btn {
            background: var(--accent);
            color: rgb(24, 22, 19);
        }

        .logout-btn:hover {
            background: rgb(224, 184, 112);
        }

        .settings-btn--danger {
            background: rgb(200, 80, 70);
            color: white;
        }

        .settings-btn--danger:hover {
            background: rgb(220, 100, 90);
        }

        /* Sidebar rail fixes */
        .sidebar {
            padding: 14px 10px 18px;
        }

        .sidebar .icon {
            flex-shrink: 0;
            width: 20px;
            text-align: center;
        }

        .sidebar-brand img {
            flex-shrink: 0;
        }

        body:not(.sidebar-expanded) .sidebar .label,
        body:not(.sidebar-expanded) .sidebar .brand-text,
        body:not(.sidebar-expanded) .sidebar .sidebar-section {
            display: none;
        }

        body:not(.sidebar-expanded) .sidebar .sidebar-header {
            padding: 6px 0 14px;
            justify-content: center;
        }

        body:not(.sidebar-expanded) .sidebar .sidebar-brand {
            gap: 0;
        }

        body:not(.sidebar-expanded) .sidebar .new-chat-btn,
        body:not(.sidebar-expanded) .sidebar .sidebar-link {
            padding: 11px 0;
            gap: 0;
            justify-content: center;
        }

        body:not(.sidebar-expanded) .sidebar .new-chat-btn .icon {
            font-size: 22px;
            line-height: 1;
        }
    </style>
</head>
<body>
    <h1 class="title">
        <span id="title-main">
            <img id="title-icon" src="/views/images/snortle.png" alt="">
            Snortle AI
        </span>
    </h1>

    <button class="sidebar-toggle is-open" id="sidebarToggle" aria-label="Toggle sidebar">‹</button>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-brand">
                <img src="/views/images/snortle.png" alt="">
                <span class="brand-text">Snortle AI</span>
            </div>
        </div>

        <button class="new-chat-btn" id="newChatBtn" type="button"><span class="icon">+</span><span class="label">New chat</span></button>
        <a class="sidebar-link" href="/"><span class="icon">🏠</span><span class="label">Home</span></a>
        <a class="sidebar-link" href="/chat"><span class="icon">💬</span><span class="label">Chat</span></a>
        <a class="sidebar-link" href="/plans"><span class="icon">💳</span><span class="label">Plans</span></a>
        <button class="sidebar-link" id="settingsBtn" type="button"><span class="icon">⚙️</span><span class="label">Settings</span></button>
    </div>

    <div class="chat-shell" id="chatShell">
        <main class="settings-box">
            <h2>Snortz Coin wallets</h2>
            <p>Manage your coins, plan, and preferences.</p>

            <div class="wallet-row">
                <span>Free wallet</span>
                <span class="wallet-amount"><img src="/views/images/snortz-coin.png" alt=""> <strong id="free-wallet-amount">0.000</strong></span>
            </div>
            <div class="wallet-row">
                <span>Purchased wallet</span>
                <span class="wallet-amount"><img src="/views/images/snortz-coin.png" alt=""> <strong id="purchased-wallet-amount">0.000</strong></span>
            </div>

            <div class="settings-divider"></div>

            <div class="settings-row"><span>Current plan</span><strong id="current-plan">Free</strong></div>
            <div class="settings-row"><span>Next Snortz Coins</span><strong id="next-coins-time">--:--:--</strong></div>

            <div class="settings-divider"></div>

            <label class="settings-theme" for="theme-select">Theme
                <select id="theme-select">
                    <option value="dark">Dark</option>
                    <option value="light">Light</option>
                    <option value="green">Eco green</option>
                </select>
            </label>

            <button class="logout-btn" id="logout-btn" type="button">Log out</button>
            <button class="settings-btn--danger" id="delete-account-btn" type="button">Delete account</button>
        </main>
    </div>

    <script src="/views/shared-settings.js"></script>
    <script>
        const sidebar = document.getElementById('sidebar');
        const sidebarToggle = document.getElementById('sidebarToggle');
        const settingsBtn = document.getElementById('settingsBtn');
        const themeSelect = document.getElementById('theme-select');
        const freeWalletAmount = document.getElementById('free-wallet-amount');
        const purchasedWalletAmount = document.getElementById('purchased-wallet-amount');
        const currentPlan = document.getElementById('current-plan');
        const nextCoinsTime = document.getElementById('next-coins-time');
        const logoutBtn = document.getElementById('logout-btn');
        const deleteAccountBtn = document.getElementById('delete-account-btn');
        const newChatBtn = document.getElementById('newChatBtn');

        sidebarToggle.addEventListener('click', () => {
            const isCollapsed = sidebar.classList.toggle('collapsed');
            document.body.classList.toggle('sidebar-collapsed', isCollapsed);
            sidebarToggle.classList.toggle('collapsed', isCollapsed);
            sidebarToggle.textContent = isCollapsed ? '›' : '‹';
        });

        sidebar.addEventListener('mouseenter', function() {
            if (!sidebar.classList.contains('collapsed')) {
                document.body.classList.add('sidebar-expanded');
            }
        });
        sidebar.addEventListener('mouseleave', function() {
            document.body.classList.remove('sidebar-expanded');
        });

        newChatBtn.addEventListener('click', function() {
            window.location.href = '/chat';
        });

        settingsBtn.addEventListener('click', function() {
            window.location.href = '/settings';
        });

        logoutBtn.addEventListener('click', async () => {
            await fetch('/api/logout', { method: 'POST' });
            window.location.href = '/';
        });

        deleteAccountBtn.addEventListener('click', function() {
            const confirmed = window.confirm('Are you sure? This cannot be undone.');
            if (!confirmed) return;
            window.alert('Account deletion requires server-side confirmation.');
        });
    </script>
</body>
</html>
